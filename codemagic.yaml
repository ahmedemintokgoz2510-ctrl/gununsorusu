workflows:
  android-apk:
    name: Gunun Sorusu Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Android klasorunu olustur
        script: |
          flutter create . --platforms=android --org com.sansar --project-name gunun_sorusu
          rm -f test/widget_test.dart
      - name: Paketleri yukle
        script: flutter pub get
      - name: APK derle
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
